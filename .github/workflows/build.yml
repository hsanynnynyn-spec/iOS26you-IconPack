name: Build Icon Pack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: |
          unzip -q iOS26you_IconPack_Project.zip -d source

      - name: Build APK
        run: |
          cd source/iOS26you_IconPack_Project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iOS26you-IconPack-APK
          path: source/iOS26you_IconPack_Project/app/build/outputs/apk/debug/app-debug.apk
          
